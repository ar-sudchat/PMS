<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Dashboard - Project Management Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #131820;
            --bg-card: #1a1f2e;
            --text-primary: #e8edf4;
            --text-secondary: #9ba3b4;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --status-critical: #ef4444;
            --status-warning: #f59e0b;
            --status-success: #10b981;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .header-stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
        
        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .toolbar-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        
        .btn-primary:hover { opacity: 0.9; }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover { background: var(--bg-secondary); }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            min-width: 150px;
        }
        
        /* Card */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        
        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            background: var(--bg-card);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: var(--bg-secondary);
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        th:hover { color: var(--text-primary); }
        
        th.sortable::after {
            content: '⇅';
            position: absolute;
            right: 8px;
            opacity: 0.3;
        }
        
        th.sort-asc::after { content: '↑'; opacity: 1; }
        th.sort-desc::after { content: '↓'; opacity: 1; }
        
        td {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
        }
        
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--status-critical); }
        .status-warning { background: rgba(245, 158, 11, 0.15); color: var(--status-warning); }
        .status-success { background: rgba(16, 185, 129, 0.15); color: var(--status-success); }
        .status-info { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent-blue);
            transition: width 0.5s ease;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }
        
        .page-btn {
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover { background: var(--bg-secondary); }
        .page-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-body { padding: 24px; }
        
        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .modal-close:hover { background: rgba(255, 255, 255, 0.1); }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            animation: toastSlideIn 0.3s ease;
            max-width: 400px;
        }
        
        @keyframes toastSlideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }
        
        /* Timeline View */
        .timeline-container {
            overflow-x: auto;
            padding: 24px 0;
        }
        
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 1200px;
        }
        
        .timeline-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .timeline-label {
            width: 200px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 500;
        }
        
        .timeline-track {
            flex: 1;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            position: relative;
        }
        
        .timeline-bar {
            position: absolute;
            height: 100%;
            background: var(--accent-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        /* Board View */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .board-column {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
        }
        
        .board-column-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .board-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .board-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        
        /* Calendar View */
        .calendar {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
        }
        
        .calendar-day:hover { background: var(--bg-primary); }
        .calendar-day.has-milestone { background: rgba(59, 130, 246, 0.2); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .toolbar { flex-direction: column; }
            .search-box { max-width: 100%; }
            .board { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
            .filter-select { width: 100%; }
        }
        
        .hidden { display: none !important; }
        
        /* Action buttons */
        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .action-view {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }
        
        .action-view:hover { background: rgba(59, 130, 246, 0.25); }
        
        /* Detail sections in modal */
        .detail-section {
            margin-bottom: 24px;
        }
        
        .detail-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Project Management Dashboard</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalProjects">47</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activeProjects">32</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="criticalProjects">8</div>
                    <div class="stat-label">Critical</div>
                </div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-view="table">Table View</button>
            <button class="tab" data-view="timeline">Timeline</button>
            <button class="tab" data-view="board">Board</button>
            <button class="tab" data-view="calendar">Calendar</button>
        </div>
        
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search projects...">
                <span class="search-icon">🔍</span>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-secondary" id="exportBtn">📥 Export</button>
                <button class="btn btn-secondary" id="compareBtn">🔄 Compare</button>
                <button class="btn btn-primary" id="addProjectBtn">+ New Project</button>
            </div>
        </div>
        
        <div class="filters">
            <select class="filter-select" id="statusFilter">
                <option value="">All Status</option>
                <option value="planning">Planning</option>
                <option value="active">Active</option>
                <option value="on-hold">On Hold</option>
                <option value="completed">Completed</option>
                <option value="critical">Critical</option>
            </select>
            <select class="filter-select" id="pmFilter">
                <option value="">All Managers</option>
            </select>
            <select class="filter-select" id="clientFilter">
                <option value="">All Clients</option>
            </select>
        </div>
        
        <!-- Table View -->
        <div id="tableView" class="view-container">
            <div class="table-container">
                <table id="projectTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="id">#</th>
                            <th class="sortable" data-sort="name">Project Name</th>
                            <th class="sortable" data-sort="client">Client</th>
                            <th class="sortable" data-sort="pm">PM</th>
                            <th class="sortable" data-sort="status">Status</th>
                            <th class="sortable" data-sort="progress">Progress</th>
                            <th class="sortable" data-sort="budget">Budget</th>
                            <th class="sortable" data-sort="deadline">Deadline</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody">
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
        
        <!-- Timeline View -->
        <div id="timelineView" class="view-container hidden">
            <div class="card">
                <h2 style="margin-bottom: 24px;">Project Timeline</h2>
                <div class="timeline-container" id="timelineContainer"></div>
            </div>
        </div>
        
        <!-- Board View -->
        <div id="boardView" class="view-container hidden">
            <div class="board" id="boardContainer"></div>
        </div>
        
        <!-- Calendar View -->
        <div id="calendarView" class="view-container hidden">
            <div class="calendar">
                <div class="calendar-header">
                    <button class="btn btn-secondary" id="prevMonth">←</button>
                    <h2 id="calendarMonth">January 2026</h2>
                    <button class="btn btn-secondary" id="nextMonth">→</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>
    </div>
    
    <!-- Project Detail Modal -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalProjectName">Project Details</h2>
                <button class="modal-close" id="closeModal">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    
    <script>
        // Mock Data Generator
        const statuses = ['planning', 'active', 'on-hold', 'completed', 'critical'];
        const pms = ['Sarah Chen', 'Michael Wong', 'Emma Davis', 'James Wilson', 'Lisa Anderson', 'David Martinez'];
        const clients = ['Acme Corp', 'TechStart Inc', 'Global Solutions', 'Innovative Systems', 'Digital Ventures', 'Smart Analytics', 'Cloud Services', 'DataTech'];
        const projectNames = [
            'ERP Implementation', 'Mobile App Development', 'Cloud Migration', 'Data Analytics Platform',
            'E-commerce Redesign', 'CRM Integration', 'Security Audit', 'Infrastructure Upgrade',
            'AI Chatbot Development', 'Blockchain Integration', 'API Development', 'DevOps Automation'
        ];
        
        function generateMockProjects(count) {
            const projects = [];
            for (let i = 1; i <= count; i++) {
                const status = statuses[Math.floor(Math.random() * statuses.length)];
                const progress = status === 'completed' ? 100 : Math.floor(Math.random() * 100);
                const budget = (Math.random() * 900000 + 100000).toFixed(0);
                const deadline = new Date(2026, Math.floor(Math.random() * 12), Math.floor(Math.random() * 28) + 1);
                
                projects.push({
                    id: i,
                    name: `${projectNames[i % projectNames.length]} ${Math.floor(i / projectNames.length) + 1}`,
                    client: clients[Math.floor(Math.random() * clients.length)],
                    pm: pms[Math.floor(Math.random() * pms.length)],
                    status,
                    progress,
                    budget: parseInt(budget),
                    deadline,
                    startDate: new Date(2025, Math.floor(Math.random() * 12), Math.floor(Math.random() * 28) + 1),
                    team: Math.floor(Math.random() * 10) + 3,
                    risks: Math.floor(Math.random() * 5),
                    notes: 'Project notes and updates will appear here.'
                });
            }
            return projects;
        }
        
        let allProjects = generateMockProjects(47);
        let filteredProjects = [...allProjects];
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentSort = { field: 'id', order: 'asc' };
        let currentView = 'table';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            populateFilters();
            renderCurrentView();
            setupEventListeners();
            startLiveUpdates();
        });
        
        function populateFilters() {
            const pmSet = new Set(allProjects.map(p => p.pm));
            const clientSet = new Set(allProjects.map(p => p.client));
            
            const pmFilter = document.getElementById('pmFilter');
            pmSet.forEach(pm => {
                const option = document.createElement('option');
                option.value = pm;
                option.textContent = pm;
                pmFilter.appendChild(option);
            });
            
            const clientFilter = document.getElementById('clientFilter');
            clientSet.forEach(client => {
                const option = document.createElement('option');
                option.value = client;
                option.textContent = client;
                clientFilter.appendChild(option);
            });
        }
        
        function setupEventListeners() {
            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    renderCurrentView();
                });
            });
            
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                applyFilters();
            });
            
            // Filters
            document.getElementById('statusFilter').addEventListener('change', applyFilters);
            document.getElementById('pmFilter').addEventListener('change', applyFilters);
            document.getElementById('clientFilter').addEventListener('change', applyFilters);
            
            // Sort
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const field = th.dataset.sort;
                    if (currentSort.field === field) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.field = field;
                        currentSort.order = 'asc';
                    }
                    updateSortIndicators();
                    sortProjects();
                    renderTableView();
                });
            });
            
            // Modal
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('projectModal').classList.remove('active');
            });
            
            document.getElementById('projectModal').addEventListener('click', (e) => {
                if (e.target.id === 'projectModal') {
                    document.getElementById('projectModal').classList.remove('active');
                }
            });
            
            // Export
            document.getElementById('exportBtn').addEventListener('click', exportData);
        }
        
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const pm = document.getElementById('pmFilter').value;
            const client = document.getElementById('clientFilter').value;
            
            filteredProjects = allProjects.filter(project => {
                const matchSearch = !search || 
                    project.name.toLowerCase().includes(search) ||
                    project.client.toLowerCase().includes(search) ||
                    project.pm.toLowerCase().includes(search);
                const matchStatus = !status || project.status === status;
                const matchPM = !pm || project.pm === pm;
                const matchClient = !client || project.client === client;
                
                return matchSearch && matchStatus && matchPM && matchClient;
            });
            
            currentPage = 1;
            renderCurrentView();
        }
        
        function sortProjects() {
            filteredProjects.sort((a, b) => {
                let aVal = a[currentSort.field];
                let bVal = b[currentSort.field];
                
                if (currentSort.field === 'deadline' || currentSort.field === 'startDate') {
                    aVal = aVal.getTime();
                    bVal = bVal.getTime();
                }
                
                if (aVal < bVal) return currentSort.order === 'asc' ? -1 : 1;
                if (aVal > bVal) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            });
        }
        
        function updateSortIndicators() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === currentSort.field) {
                    th.classList.add(currentSort.order === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }
        
        function renderCurrentView() {
            document.querySelectorAll('.view-container').forEach(v => v.classList.add('hidden'));
            
            switch(currentView) {
                case 'table':
                    document.getElementById('tableView').classList.remove('hidden');
                    renderTableView();
                    break;
                case 'timeline':
                    document.getElementById('timelineView').classList.remove('hidden');
                    renderTimelineView();
                    break;
                case 'board':
                    document.getElementById('boardView').classList.remove('hidden');
                    renderBoardView();
                    break;
                case 'calendar':
                    document.getElementById('calendarView').classList.remove('hidden');
                    renderCalendarView();
                    break;
            }
        }
        
        function renderTableView() {
            const tbody = document.getElementById('projectTableBody');
            tbody.innerHTML = '';
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageProjects = filteredProjects.slice(start, end);
            
            pageProjects.forEach(project => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${project.id}</td>
                    <td><strong>${project.name}</strong></td>
                    <td>${project.client}</td>
                    <td>${project.pm}</td>
                    <td><span class="status-badge status-${getStatusClass(project.status)}">${project.status}</span></td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${project.progress}%"></div>
                        </div>
                        <small style="color: var(--text-muted);">${project.progress}%</small>
                    </td>
                    <td>$${project.budget.toLocaleString()}</td>
                    <td>${formatDate(project.deadline)}</td>
                    <td>
                        <button class="action-btn action-view" onclick="viewProject(${project.id})">View</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            renderPagination();
            updateStats();
        }
        
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            const totalPages = Math.ceil(filteredProjects.length / itemsPerPage);
            
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '←';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTableView();
                }
            });
            pagination.appendChild(prevBtn);
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const btn = document.createElement('button');
                    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    btn.textContent = i;
                    btn.addEventListener('click', () => {
                        currentPage = i;
                        renderTableView();
                    });
                    pagination.appendChild(btn);
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    const span = document.createElement('span');
                    span.textContent = '...';
                    span.style.padding = '0 8px';
                    span.style.color = 'var(--text-muted)';
                    pagination.appendChild(span);
                }
            }
            
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '→';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTableView();
                }
            });
            pagination.appendChild(nextBtn);
        }
        
        function renderTimelineView() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';
            
            const timeline = document.createElement('div');
            timeline.className = 'timeline';
            
            filteredProjects.forEach(project => {
                const row = document.createElement('div');
                row.className = 'timeline-row';
                
                const label = document.createElement('div');
                label.className = 'timeline-label';
                label.textContent = project.name;
                
                const track = document.createElement('div');
                track.className = 'timeline-track';
                
                const startPercent = ((project.startDate.getMonth() / 12) * 100);
                const endPercent = ((project.deadline.getMonth() / 12) * 100);
                const duration = endPercent - startPercent;
                
                const bar = document.createElement('div');
                bar.className = 'timeline-bar';
                bar.style.left = `${startPercent}%`;
                bar.style.width = `${duration}%`;
                bar.textContent = `${project.progress}%`;
                bar.style.background = project.status === 'critical' ? 'var(--status-critical)' : 
                                       project.status === 'completed' ? 'var(--status-success)' : 
                                       'var(--accent-blue)';
                
                track.appendChild(bar);
                row.appendChild(label);
                row.appendChild(track);
                timeline.appendChild(row);
            });
            
            container.appendChild(timeline);
        }
        
        function renderBoardView() {
            const container = document.getElementById('boardContainer');
            container.innerHTML = '';
            
            statuses.forEach(status => {
                const column = document.createElement('div');
                column.className = 'board-column';
                
                const header = document.createElement('div');
                header.className = 'board-column-header';
                header.textContent = status.toUpperCase();
                column.appendChild(header);
                
                const statusProjects = filteredProjects.filter(p => p.status === status);
                statusProjects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'board-card';
                    card.innerHTML = `
                        <strong>${project.name}</strong>
                        <div style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">
                            ${project.client}
                        </div>
                        <div style="margin-top: 8px;">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${project.progress}%"></div>
                            </div>
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">
                            ${project.pm} • ${formatDate(project.deadline)}
                        </div>
                    `;
                    card.addEventListener('click', () => viewProject(project.id));
                    column.appendChild(card);
                });
                
                container.appendChild(column);
            });
        }
        
        function renderCalendarView() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const daysInMonth = 31;
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.style.textAlign = 'center';
                header.style.fontWeight = '600';
                header.style.padding = '8px';
                header.style.color = 'var(--text-secondary)';
                header.textContent = day;
                grid.appendChild(header);
            });
            
            for (let i = 1; i <= daysInMonth; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                
                const hasMilestone = filteredProjects.some(p => p.deadline.getDate() === i);
                if (hasMilestone) {
                    day.classList.add('has-milestone');
                }
                
                day.innerHTML = `<div style="font-weight: 600;">${i}</div>`;
                if (hasMilestone) {
                    const count = filteredProjects.filter(p => p.deadline.getDate() === i).length;
                    day.innerHTML += `<div style="font-size: 10px; color: var(--accent-blue);">${count} project${count > 1 ? 's' : ''}</div>`;
                }
                
                grid.appendChild(day);
            }
        }
        
        function viewProject(id) {
            const project = allProjects.find(p => p.id === id);
            if (!project) return;
            
            document.getElementById('modalProjectName').textContent = project.name;
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-section">
                    <h3>Project Information</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Client</div>
                            <div class="detail-value">${project.client}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Project Manager</div>
                            <div class="detail-value">${project.pm}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="status-badge status-${getStatusClass(project.status)}">${project.status}</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Progress</div>
                            <div class="detail-value">${project.progress}%</div>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>Timeline</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Start Date</div>
                            <div class="detail-value">${formatDate(project.startDate)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Deadline</div>
                            <div class="detail-value">${formatDate(project.deadline)}</div>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>Budget & Resources</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Budget</div>
                            <div class="detail-value">$${project.budget.toLocaleString()}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Team Size</div>
                            <div class="detail-value">${project.team} members</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Risks</div>
                            <div class="detail-value">${project.risks} identified</div>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>Notes</h3>
                    <div style="padding: 16px; background: var(--bg-secondary); border-radius: 12px;">
                        ${project.notes}
                    </div>
                </div>
            `;
            
            document.getElementById('projectModal').classList.add('active');
        }
        
        function updateStats() {
            document.getElementById('totalProjects').textContent = allProjects.length;
            document.getElementById('activeProjects').textContent = allProjects.filter(p => p.status === 'active').length;
            document.getElementById('criticalProjects').textContent = allProjects.filter(p => p.status === 'critical').length;
        }
        
        function getStatusClass(status) {
            if (status === 'critical') return 'critical';
            if (status === 'completed') return 'success';
            if (status === 'on-hold') return 'warning';
            return 'info';
        }
        
        function formatDate(date) {
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        function startLiveUpdates() {
            setInterval(() => {
                const randomProject = allProjects[Math.floor(Math.random() * allProjects.length)];
                const oldProgress = randomProject.progress;
                
                if (randomProject.status !== 'completed' && Math.random() > 0.7) {
                    randomProject.progress = Math.min(100, randomProject.progress + Math.floor(Math.random() * 5));
                    
                    if (randomProject.progress !== oldProgress && currentView === 'table') {
                        renderTableView();
                        
                        if (randomProject.status === 'critical' && Math.random() > 0.8) {
                            showToast(`⚠️ Critical project "${randomProject.name}" updated: ${randomProject.progress}% complete`);
                        }
                    }
                }
            }, 30000);
        }
        
        function exportData() {
            const csv = [
                ['ID', 'Project', 'Client', 'PM', 'Status', 'Progress', 'Budget', 'Deadline'].join(','),
                ...filteredProjects.map(p => [
                    p.id,
                    `"${p.name}"`,
                    `"${p.client}"`,
                    `"${p.pm}"`,
                    p.status,
                    p.progress,
                    p.budget,
                    formatDate(p.deadline)
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'projects_export.csv';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('✅ Data exported successfully!');
        }
    </script>
</body>
</html>
